# fly.toml app configuration file generated for timetoleave on 2026-09-17T12:31:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'timetoleave'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/bot.sqlite3'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
